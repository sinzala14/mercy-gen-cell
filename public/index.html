<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercy Gen Cell SelfGuide</title>
<link rel="icon" href="assets/logo-orange-tile.png">
<style>
:root{
  --b50:#FFF7ED;--b100:#FFEDD5;--b200:#FED7AA;--b300:#FDBA74;--b500:#F97316;--b600:#EA580C;--b700:#C2410C;--b800:#9A3412;--b900:#7C2D12;
  --bg:#FAF7F2;--tx:#1C1917;--muted:#685D54;--card:rgba(255,255,255,.92);--border:rgba(234,88,12,.16);
  --sans:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:Georgia,Cambria,'Times New Roman',Times,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{
  margin:0;color:var(--tx);font:15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 85% 420px at 50% -110px,rgba(249,115,22,.14),transparent 70%),
    radial-gradient(circle at 88% 20%,rgba(251,146,60,.08),transparent 45%),
    radial-gradient(rgba(194,65,12,.09) 1px,transparent 1px),
    linear-gradient(to right,rgba(234,88,12,.03) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(234,88,12,.03) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,24px 24px,48px 48px,48px 48px;
  background-attachment:fixed;
}
button,input,textarea,select{font:inherit}

/* Top Brand Header */
.top-brand{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:800px;margin:0 auto;padding:16px 18px 4px;
}
.brand-left{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo{
  width:52px;height:35px;border-radius:11px;background:linear-gradient(135deg,var(--b600),var(--b700));
  padding:6px 9px;flex:none;box-shadow:0 6px 14px rgba(234,88,12,.26),inset 0 1px 1px rgba(255,255,255,.35);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand{font-weight:800;color:var(--b800);font-size:16.5px;letter-spacing:-.02em}
.brand-sub{font-size:12px;color:var(--muted);font-weight:500}
.pill-badge{
  display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);
  border:1px solid var(--border);color:var(--b700);font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(31,26,23,.04);backdrop-filter:blur(8px);
}
.pill-dot{width:7px;height:7px;border-radius:50%;background:var(--b500)}

/* Lower Floating Liquid Nav */
nav{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.58);backdrop-filter:blur(24px) saturate(195%);-webkit-backdrop-filter:blur(24px) saturate(195%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 16px 40px rgba(28,25,23,.15),0 4px 14px rgba(234,88,12,.1),inset 0 1.5px 1px rgba(255,255,255,.98),inset 0 -1px 2px rgba(253,186,116,.28);
  border-radius:999px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:10px 16px;z-index:50;max-width:calc(100vw - 24px);
}
nav a{
  display:flex;align-items:center;gap:8px;padding:10px 19px;border-radius:999px;
  text-decoration:none;color:var(--tx);white-space:nowrap;font:600 13.5px/1 var(--sans);
  background:linear-gradient(180deg,rgba(255,255,255,.96) 0%,rgba(255,250,245,.8) 100%);
  border:1px solid rgba(255,255,255,.96);
  box-shadow:0 4px 12px rgba(28,25,23,.07),inset 0 1.5px 1px #fff,inset 0 -1px 2px rgba(234,88,12,.08);
  transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s ease,background .2s ease,color .2s ease;
}
nav a:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(28,25,23,.11),inset 0 1.5px 1px #fff}
nav a svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none;transition:transform .2s ease}
nav a.on{
  background:linear-gradient(180deg,#fff 0%,#FFF7ED 100%);color:var(--b600);border-color:#fff;
  box-shadow:0 7px 20px rgba(234,88,12,.25),0 2px 6px rgba(28,25,23,.08),inset 0 2px 2px #fff,inset 0 -1px 2px rgba(249,115,22,.22);
  transform:translateY(-1.5px);
}
nav a.on svg{transform:scale(1.08);stroke-width:2.25}
@media(max-width:540px){
  nav{gap:12px;padding:8px 12px;width:calc(100vw - 24px);max-width:430px}
  nav a{flex:1;flex-direction:column;justify-content:center;gap:4px;padding:9px 10px;font-size:11.5px}
  .pill-badge span:last-child{display:none}
}

/* Layout & Containers */
main{max-width:800px;margin:0 auto;padding:14px 18px calc(120px + env(safe-area-inset-bottom,0px))}
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 92% 14%,rgba(255,255,255,.18) 0%,transparent 42%),
    radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px),
    linear-gradient(135deg,var(--b800) 0%,var(--b600) 58%,var(--b500) 100%);
  background-size:100% 100%,20px 20px,100% 100%;
  color:#fff;border-radius:22px;padding:28px 26px;margin-bottom:20px;
  box-shadow:0 16px 36px rgba(194,65,12,.22),inset 0 1px 1px rgba(255,255,255,.28);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.hero img{width:84px;height:44px;background:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.hero-tag{
  font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  padding:4px 11px;border-radius:999px;backdrop-filter:blur(6px);
}
.hero h1{margin:4px 0 6px;font-size:clamp(23px,4vw,29px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
.hero p{margin:4px 0;opacity:.94;font-size:15.5px;max-width:600px}

/* Section Headers */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px;flex-wrap:wrap}
.sec-head h2,h2{color:var(--b800);margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
h3{color:var(--b800);margin:0 0 6px;font-size:16.5px;font-weight:700;letter-spacing:-.01em}

/* Cards & Surfaces */
.card{
  background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:18px;padding:20px;margin:14px 0;
  box-shadow:0 8px 24px rgba(28,25,23,.04),inset 0 1px 0 rgba(255,255,255,.9);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin:14px 0}
.grid-2 .card{margin:0;height:100%;display:flex;flex-direction:column;justify-content:space-between}

/* Inputs & Controls */
textarea,input,select{
  width:100%;padding:13px 15px;border:1.5px solid rgba(234,88,12,.25);border-radius:14px;
  background:#fff;color:var(--tx);font-size:15px;transition:border-color .18s ease,box-shadow .18s ease;
  box-shadow:inset 0 1px 2px rgba(28,25,23,.03);
}
textarea:focus,input:focus,select:focus{
  outline:none;border-color:var(--b500);box-shadow:0 0 0 3.5px rgba(249,115,22,.15);
}
textarea.invalid{border-color:#DC2626;box-shadow:0 0 0 3.5px rgba(220,38,38,.14)}
textarea{min-height:125px;resize:vertical;line-height:1.55}
.input-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}

/* Buttons */
.btn{
  background:linear-gradient(180deg,var(--b500) 0%,var(--b600) 100%);color:#fff;border:0;
  border-radius:13px;padding:11.5px 20px;cursor:pointer;font-weight:700;font-size:14.5px;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 16px rgba(234,88,12,.25),inset 0 1px 1px rgba(255,255,255,.35);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
.btn:hover:not([disabled]){background:linear-gradient(180deg,var(--b600) 0%,var(--b700) 100%);transform:translateY(-1px);box-shadow:0 8px 20px rgba(234,88,12,.32)}
.btn:active:not([disabled]){transform:translateY(0)}
.btn.o{
  background:#fff;color:var(--b700);border:1.5px solid rgba(234,88,12,.35);
  box-shadow:0 3px 8px rgba(28,25,23,.04);
}
.btn.o:hover:not([disabled]){background:var(--b50);border-color:var(--b600)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.65;cursor:not-allowed;transform:none}
.btn-ring{
  width:15px;height:15px;border:2.2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:rot .7s linear infinite;flex:none;
}
@keyframes rot{to{transform:rotate(360deg)}}

/* Scripture & Verse Blocks */
.v-card{
  background:linear-gradient(180deg,#fff 0%,#FFFDF9 100%);
  border:1px solid rgba(234,88,12,.2);border-radius:18px;padding:18px 20px;margin:12px 0;
  box-shadow:0 6px 20px rgba(28,25,23,.04);
}
.v-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.v-ref{font-size:16.5px;font-weight:800;color:var(--b800);letter-spacing:-.01em}
.v-badges{display:inline-flex;align-items:center;gap:6px}
.v-tr{
  font-size:11.5px;font-weight:700;color:var(--b700);background:var(--b100);
  padding:3px 9px;border-radius:999px;letter-spacing:.04em;
}
.yv-link{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  color:var(--b700);background:#fff;border:1px solid rgba(234,88,12,.3);
  padding:3px 10px;border-radius:999px;text-decoration:none;transition:all .15s ease;
}
.yv-link:hover{background:var(--b600);color:#fff;border-color:var(--b600)}
.yv-link svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.verse{
  background:linear-gradient(90deg,var(--b50) 0%,rgba(255,247,237,.45) 100%);
  border-left:4px solid var(--b500);padding:13px 16px;border-radius:0 12px 12px 0;
  margin:10px 0 12px;font:italic 16.5px/1.65 var(--serif);color:#29221E;
}
.v-why{
  background:rgba(250,247,242,.85);border-radius:11px;padding:10px 13px;
  border:1px solid rgba(234,88,12,.1);font-size:14px;color:var(--tx);
}
.v-why p{margin:3px 0 0;color:#3F3832}

/* Tags & Chips */
.tag{
  display:inline-flex;align-items:center;gap:5px;background:var(--b100);color:var(--b800);
  border:1px solid rgba(234,88,12,.2);border-radius:999px;padding:4px 12px;
  margin:3px 6px 3px 0;font:600 12.5px var(--sans);
}
.step-label{display:block;font-weight:700;font-size:14px;color:var(--b800);margin:12px 0 7px}
.step-label:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chips button{
  background:#fff;border:1.5px solid rgba(234,88,12,.22);color:var(--tx);
  border-radius:999px;padding:7px 15px;cursor:pointer;font-size:13.5px;font-weight:600;
  transition:all .16s ease;box-shadow:0 2px 5px rgba(28,25,23,.03);
}
.chips button:hover{border-color:var(--b500);background:var(--b50)}
.chips button.on{
  background:var(--b600);color:#fff;border-color:var(--b600);
  box-shadow:0 4px 12px rgba(234,88,12,.28);transform:translateY(-1px);
}

/* Information Lists & Callouts */
.q-list{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:9px}
.q-list li{
  display:flex;align-items:flex-start;gap:11px;background:var(--b50);
  border:1px solid rgba(234,88,12,.14);border-radius:12px;padding:11px 14px;font-size:14.5px;
}
.q-num{
  width:23px;height:23px;border-radius:50%;background:var(--b600);color:#fff;
  font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px;
}
.band{
  background:linear-gradient(135deg,#FFF7ED 0%,#FFEDD5 100%);
  border:1px solid rgba(234,88,12,.25);border-radius:18px;padding:20px;margin:18px 0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.band-info{flex:1;min-width:230px}
.band-info p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.alert{
  background:linear-gradient(135deg,var(--b900),#991B1B);color:#fff;
  border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 28px rgba(124,45,18,.28);
}
.lab{
  display:inline-flex;align-items:center;gap:6px;
  font:700 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--b600);margin-bottom:4px;
}
small,.note{color:var(--muted);font-size:13px;line-height:1.45}
.disclaimer{
  display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.7);
  border:1px dashed rgba(234,88,12,.28);border-radius:13px;padding:11px 14px;margin:12px 0;
  font-size:12.8px;color:var(--muted);
}
.disc-ico{width:18px;height:18px;stroke:var(--b600);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.search-box{position:relative;margin-bottom:10px}
.search-box input{padding-left:40px}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}

/* Replying Animation & Staggered Reveal */
.reply-card{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,255,255,.96) 0%,rgba(255,247,237,.92) 100%);
  border:1.5px solid rgba(234,88,12,.24);border-radius:18px;padding:22px;margin:16px 0;
  box-shadow:0 12px 32px rgba(234,88,12,.1),inset 0 1px 0 #fff;
  animation:revealUp .28s cubic-bezier(.22,1,.36,1) both;
}
.reply-top{display:flex;align-items:center;gap:14px}
.reply-orb{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--b500),var(--b700));color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 6px 16px rgba(234,88,12,.3);animation:orbFloat 2s ease-in-out infinite;
}
.reply-orb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reply-body{flex:1}
.reply-title{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--b800);font-size:15.5px}
.reply-step{color:var(--muted);font-size:13.5px;margin-top:2px;transition:opacity .2s ease}
.wave-dots{display:inline-flex;align-items:center;gap:4px}
.wave-dots span{
  width:6px;height:6px;border-radius:50%;background:var(--b600);
  animation:waveBounce 1.2s infinite ease-in-out;
}
.wave-dots span:nth-child(2){animation-delay:.16s}
.wave-dots span:nth-child(3){animation-delay:.32s}
.reply-bar{
  height:4px;border-radius:99px;background:rgba(234,88,12,.12);
  overflow:hidden;margin-top:16px;position:relative;
}
.reply-bar::after{
  content:'';position:absolute;top:0;left:-40%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,var(--b500),var(--b600),transparent);
  border-radius:99px;animation:barSlide 1.35s infinite ease-in-out;
}
.reply-skel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.skel-line{
  height:10px;border-radius:99px;
  background:linear-gradient(90deg,rgba(234,88,12,.08) 25%,rgba(234,88,12,.18) 50%,rgba(234,88,12,.08) 75%);
  background-size:200% 100%;animation:shimmer 1.6s infinite linear;
}
@keyframes waveBounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.04)}}
@keyframes barSlide{0%{left:-45%}100%{left:100%}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes revealUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.reveal{animation:revealUp .35s cubic-bezier(.22,1,.36,1) both}

/* Error & Warning Messages */
.val-err{
  display:flex;align-items:center;gap:8px;background:#FEF2F2;border:1px solid #FECACA;
  color:#B91C1C;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;
  margin-top:10px;animation:shake .32s ease;
}
.val-err svg,.err-ico,.warn-ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.err-card{
  background:linear-gradient(135deg,#FFF5F5 0%,#FEF2F2 100%);
  border:1.5px solid #FCA5A5;border-radius:18px;padding:18px 20px;margin:16px 0;
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;
  color:#991B1B;box-shadow:0 8px 22px rgba(185,28,28,.08);animation:revealUp .25s ease both;
}
.err-main{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:220px}
.err-main h3{color:#991B1B;margin:0 0 4px;font-size:15.5px}
.err-main p{margin:0;font-size:13.8px;color:#7F1D1D}
.warn-banner{
  display:flex;align-items:center;gap:10px;background:#FFFBEB;border:1px solid #FDE68A;
  color:#92400E;border-radius:13px;padding:10px 14px;margin:10px 0;font-size:13px;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style></head><body>
<header class="top-brand">
  <a href="#home" class="brand-left">
    <img class="logo" alt="Mercy Gen Cell logo" src="assets/logo-white.png">
    <div class="brand-text">
      <span class="brand">Mercy Gen Cell</span>
      <span class="brand-sub">Scripture SelfGuide</span>
    </div>
  </a>
  <div class="pill-badge"><span class="pill-dot"></span><span>Verified KJV Scripture</span></div>
</header>
<main id="app"></main>
<nav id="nav" aria-label="Primary"></nav>
<script>
const LOGO="assets/logo-white.png";
const FEEL={Fear:"afraid",Anger:"angry",Sadness:"sad",Confusion:"confused",Loneliness:"alone",Guilt:"guilty",Hope:"hopeful",Gratitude:"grateful","I don\u2019t know":"unsure"};
const AREAS=["Faith","Family","Relationships","School","Career","Money","Health","Purpose","Future","Other"];
const BIBLE_CHIPS=["Fear","Peace","Forgiveness","Wisdom","Hope","Strength","Loneliness","Trust"];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';

const api=async(p,o)=>{
  let r;
  try{r=await fetch(p,o)}
  catch(netErr){throw new Error('Unable to reach the server. Please check your internet connection and try again.')}
  let data=null;
  try{data=await r.json()}catch(e){}
  if(!r.ok){
    const msg=data?.error||(r.status===429?'Too many requests right now. Please wait a few seconds and try again.':`Server error (${r.status}). Please try again.`);
    throw new Error(msg);
  }
  return data;
};
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});

let guide={f:null,a:null},lastAnalyzeText='',lastPrayerTopic='',replyTimer=null;

const YV_BOOKS={
  'genesis':'GEN','exodus':'EXO','leviticus':'LEV','numbers':'NUM','deuteronomy':'DEU','joshua':'JOS','judges':'JDG','ruth':'RUT',
  '1 samuel':'1SA','2 samuel':'2SA','1 kings':'1KI','2 kings':'2KI','1 chronicles':'1CH','2 chronicles':'2CH','ezra':'EZR','nehemiah':'NEH','esther':'EST',
  'job':'JOB','psalm':'PSA','psalms':'PSA','proverbs':'PRO','ecclesiastes':'ECC','song of solomon':'SNG','isaiah':'ISA','jeremiah':'JER','lamentations':'LAM',
  'ezekiel':'EZK','daniel':'DAN','hosea':'HOS','joel':'JOL','amos':'AMO','obadiah':'OBA','jonah':'JON','micah':'MIC','nahum':'NAM','habakkuk':'HAB',
  'zephaniah':'ZEP','haggai':'HAG','zechariah':'ZEC','malachi':'MAL','matthew':'MAT','mark':'MRK','luke':'LUK','john':'JHN','acts':'ACT','romans':'ROM',
  '1 corinthians':'1CO','2 corinthians':'2CO','galatians':'GAL','ephesians':'EPH','philippians':'PHP','colossians':'COL','1 thessalonians':'1TH','2 thessalonians':'2TH',

const yvSearchUrl=q=>q?`https://www.bible.com/search/bible?q=${encodeURIComponent(q)}`:YV_HOME;
function yvUrl(ref){
  const m=String(ref||'').trim().match(/^((?:[1-3]\s+)?[A-Za-z\s]+?)\s+(\d+)(?::(\d+(?:[\u2013\-]\d+)?))?$/);
  if(m){
    const code=YV_BOOKS[m[1].trim().toLowerCase()];
    if(code){
      const ch=m[2],v=m[3]?'.'+m[3].replace(/\u2013/g,'-'):'';
      return `https://www.bible.com/bible/1/${code}.${ch}${v}.KJV`;
    }
  }
  return yvSearchUrl(ref);
}

function startReplyAnim(containerId,title,steps){
  if(replyTimer){clearInterval(replyTimer);replyTimer=null;}
  const el=document.getElementById(containerId);
  if(!el)return;
  let idx=0;
  el.innerHTML=`<div class="reply-card">
    <div class="reply-top">
      <div class="reply-orb">
        <svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zm20 0h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div class="reply-body">
        <div class="reply-title"><span>${esc(title)}</span><span class="wave-dots"><span></span><span></span><span></span></span></div>
        <div class="reply-step" id="${containerId}_step">${esc(steps[0]||'Looking at Scripture\u2026')}</div>
      </div>
    </div>
    <div class="reply-bar"></div>
    <div class="reply-skel"><div class="skel-line"></div><div class="skel-line" style="width:78%"></div></div>
  </div>`;
  if(steps.length>1){
    replyTimer=setInterval(()=>{
      idx=(idx+1)%steps.length;
      const sEl=document.getElementById(containerId+'_step');
      if(sEl)sEl.textContent=steps[idx];
      else{clearInterval(replyTimer);replyTimer=null;}
    },2200);
  }
}

function stopReplyAnim(){
  if(replyTimer){clearInterval(replyTimer);replyTimer=null;}
}

  guide[k]=guide[k]===val?null:val;

  showValErr('guideErr','');
  const p=document.getElementById('gPreview');
  if(p){
    p.textContent=(guide.f||guide.a)?`Selected: \u201cI feel ${FEEL[guide.f]||'unsure'} about ${(guide.a||'life').toLowerCase()}.\u201d`:'Choose a feeling or life area above to begin.';
  }
}

function show(r,text){

    o.scrollIntoView({behavior:'smooth'});

  const tr=esc(r.scriptures[0]?.translation||'KJV');
  const modeLabel=r.aiUsed?'Gen Spiritual Guide':'Verified Theme Matcher';

        </div>

    ${r.scriptures.map(vBlock).join('')}
    <div class="grid-2">
      <div class="card reveal">
        <div>
          <span class="lab">Questions for Reflection</span>
          <h3>Ask Yourself</h3>

        <div>
          <span class="lab">Practical Next Step</span>

          <p style="margin:8px 0 16px">${esc(r.next_step)}</p>

        </div>
        <div><button type="button" class="btn o sm" data-action="copy" data-copy="${esc(r.prayer)}">Copy Prayer</button></div>
      </div>
    </div>

  o.scrollIntoView({behavior:'smooth'});
}

async function go(text){
  lastAnalyzeText=text;
  const b=document.getElementById('go'),bg=document.getElementById('goGuided');
  const origB=b?b.innerHTML:'',origBg=bg?bg.innerHTML:'';
  if(b){b.disabled=true;b.innerHTML='<span class="btn-ring"></span><span>Reflecting\u2026</span>';}
  if(bg){bg.disabled=true;bg.innerHTML='<span class="btn-ring"></span><span>Finding Scripture\u2026</span>';}
  startReplyAnim('out','SelfGuide is reflecting',[
    'Reading what you shared with care\u2026',
    'Searching verified KJV Scriptures for relevant passages\u2026',
    'Connecting with Gen Spiritual Guide & preparing reflection questions\u2026',
    'Writing a Scripture-anchored prayer starter\u2026'
  ]);
  const outEl=document.getElementById('out');
  if(outEl)outEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  try{
    const res=await post('/api/selfguide/analyze',{situation:text});
    show(res,text);
  }catch(e){
    stopReplyAnim();
    if(outEl)outEl.innerHTML=errCard('Could not complete reflection',e.message||'Something went wrong while analyzing your situation. Please try again.','retry-analyze');
  }finally{
    if(b){b.disabled=false;b.innerHTML=origB||'Start SelfGuide';}
    if(bg){bg.disabled=false;bg.innerHTML=origBg||'Find Scripture';}
  }
}

function run(){
  const el=document.getElementById('sit');
  if(!el)return;
  const t=el.value.trim();
  if(t.length<3){
    el.classList.add('invalid');
    showValErr('sitErr','Please write at least a few words (3+ characters) about what you are going through.');
    el.focus();
    return;
  }
  el.classList.remove('invalid');
  showValErr('sitErr','');
  go(t);
}

function runGuided(){
  if(!guide.f&&!guide.a){
    showValErr('guideErr','Please select at least one feeling or life area above before clicking Find Scripture.');
    return;
  }
  showValErr('guideErr','');
  go(`I feel ${FEEL[guide.f]||'unsure'} about ${(guide.a||'life').toLowerCase()}.`);
}

function setSearch(val){
  const q=document.getElementById('q');
  if(q){q.value=val;bs();}
}

async function bs(){
  const qEl=document.getElementById('q'),q=qEl?qEl.value.trim():'';
  const yvBtn=document.getElementById('yvSearchBtn');
  if(yvBtn){
    yvBtn.href=q?yvUrl(q):YV_HOME;
    yvBtn.innerHTML=(q?`Open \u201c${esc(q.slice(0,24))}\u201d on YouVersion `:'Read on YouVersion ')+extIco;
  }
  const bout=document.getElementById('bout');
  if(!bout)return;
  try{
    const r=await api('/api/scriptures/search?q='+encodeURIComponent(q));
    const head=`<div class="sec-head" style="margin-top:14px"><h3>${r.results.length} Scripture Passage${r.results.length===1?'':'s'}</h3><span class="note">${q?`Matching \u201c${esc(q)}\u201d`:'All curated passages'}</span></div>`;
    bout.innerHTML=r.results.length?head+r.results.map(vBlock).join(''):`<div class="card reveal"><p style="margin:0 0 12px">No matching passage in the quick library for <b>\u201c${esc(q)}\u201d</b>. You can open or search this passage directly in the full YouVersion Bible:</p><a class="btn sm" href="${esc(yvUrl(q))}" target="_blank" rel="noopener">Open \u201c${esc(q)}\u201d on YouVersion Bible ${extIco}</a></div>`;
  }catch(e){
    bout.innerHTML=errCard('Could not search Scriptures',e.message||'Please try again.','retry-bible');
  }
}

async function pr(topic){
  const sel=document.getElementById('pt'),o=document.getElementById('pout');
  if(!o)return;
  const k=topic!==undefined?topic:(sel?sel.value:'');
  lastPrayerTopic=k;
  if(sel&&sel.value!==k)sel.value=k;
  document.querySelectorAll('#pChips button').forEach(b=>b.classList.toggle('on',b.dataset.topic===k));
  if(!k){o.innerHTML='';return;}
  startReplyAnim('pout',`Preparing prayer for ${cap(k)}`,[
    `Finding anchor KJV Scripture for ${k}\u2026`,
    'Composing a Scripture-rooted prayer starter\u2026'
  ]);
  try{
    const r=await post('/api/prayer/generate',{topic:k});
    stopReplyAnim();
    o.innerHTML=`
      <div class="card reveal">
        <div class="card-head">
          <span class="lab">Prayer Starter \u2022 ${esc(cap(k))}</span>
          <button type="button" class="btn o sm" data-action="copy" data-copy="${esc(r.prayer)}">Copy Prayer</button>
        </div>
        <p class="note" style="margin:0 0 8px">Use these words as a starting point to talk with God honestly:</p>
        <div class="verse" style="margin:0">${esc(r.prayer)}</div>
      </div>
      <div class="sec-head reveal"><h3>Anchoring Scripture</h3></div>
      ${vBlock(r.scripture)}`;
  }catch(e){
    stopReplyAnim();
    o.innerHTML=errCard('Could not generate prayer starter',e.message||'Please try selecting the topic again.','retry-prayer');
  }
}

/* Unified Event Delegation - works under strict CSP with zero inline onclick handlers */
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const act=btn.dataset.action;
  if(act==='run')run();
  else if(act==='pick')pick(btn.dataset.kind,btn.dataset.val,btn);
  else if(act==='run-guided')runGuided();
  else if(act==='set-search')setSearch(btn.dataset.val||'');
  else if(act==='prayer-topic')pr(btn.dataset.topic||'');
  else if(act==='copy'){
    const txt=btn.dataset.copy||'';
    navigator.clipboard?.writeText(txt);
    const old=btn.textContent;btn.textContent='Copied!';
    setTimeout(()=>btn.textContent=old,1600);
  }
  else if(act==='retry-analyze'&&lastAnalyzeText)go(lastAnalyzeText);
  else if(act==='retry-daily')loadDaily();
  else if(act==='retry-bible')bs();
  else if(act==='retry-prayer')pr(lastPrayerTopic);
  else if(act==='retry-prayer-init')initPrayer();
});

document.addEventListener('input',e=>{
  if(e.target.id==='sit'){
    const c=document.getElementById('charCount');
    if(c)c.textContent=`${e.target.value.length} / 2000`;
    if(e.target.value.trim().length>=3){
      e.target.classList.remove('invalid');
      showValErr('sitErr','');
    }
  }else if(e.target.id==='q'){
    bs();
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='pt')pr(e.target.value);
});

document.addEventListener('keydown',e=>{
  if(e.target.id==='sit'&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    e.preventDefault();run();
  }
});

addEventListener('hashchange',render);render();
